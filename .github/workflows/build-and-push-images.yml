name: Build and Push Images

# Builds gateway + 8 microservice images and pushes to GHCR.
# Triggers: merged PR to dev/staging, or manual workflow_dispatch.
# Does NOT run on direct push to branches.

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from
        required: true
        default: dev
        type: string

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPO_NAME: supportflow

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: GatewayDockerfile
          - service: identity
            dockerfile: IdentityDockerfile
          - service: workspace
            dockerfile: WorkspaceDockerfile
          - service: conversation
            dockerfile: ConversationDockerfile
          - service: ticket
            dockerfile: TicketDockerfile
          - service: customer
            dockerfile: CustomerDockerfile
          - service: knowledge
            dockerfile: KnowledgeDockerfile
          - service: ai
            dockerfile: AIDockerfile
          - service: notification
            dockerfile: NotificationDockerfile

    steps:
      - name: Detect target branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.branch }}"
          else
            BRANCH="${{ github.event.pull_request.base.ref }}"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Target branch: ${BRANCH}"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 1

      - name: Set image tags from branch
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ steps.branch.outputs.branch }}"
          case "${BRANCH}" in
            dev)
              PRIMARY="dev"
              ALIASES=""
              ;;
            staging)
              PRIMARY="staging_env1"
              ALIASES="staging_env2"
              ;;
            *)
              PRIMARY="${BRANCH}"
              ALIASES=""
              ;;
          esac
          echo "primary=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "aliases=${ALIASES}" >> "$GITHUB_OUTPUT"
          echo "Primary tag: ${PRIMARY}"
          if [ -n "${ALIASES}" ]; then
            echo "Alias tags: ${ALIASES}"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        shell: bash
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_REPO_NAME }}
          PRIMARY_TAG: ${{ steps.tags.outputs.primary }}
          ALIAS_TAGS: ${{ steps.tags.outputs.aliases }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_PREFIX}/${{ matrix.service }}"
          DOCKERFILE="${{ matrix.dockerfile }}"

          echo "Building ${IMAGE}:${PRIMARY_TAG} using ${DOCKERFILE}"
          docker build -f "${DOCKERFILE}" -t "${IMAGE}:${PRIMARY_TAG}" .

          TAGS=("${PRIMARY_TAG}")
          if [ -n "${ALIAS_TAGS}" ]; then
            IFS=',' read -ra ALIASES <<< "${ALIAS_TAGS}"
            for alias in "${ALIASES[@]}"; do
              echo "Tagging alias: ${alias}"
              docker tag "${IMAGE}:${PRIMARY_TAG}" "${IMAGE}:${alias}"
              TAGS+=("${alias}")
            done
          fi

          for tag in "${TAGS[@]}"; do
            echo "Pushing ${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done

          echo "Done: ${{ matrix.service }}"
